<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Table Finder</title>
<meta name="description" content="Find a wedding guest's table fast, in Arabic, Hebrew or English.">
<meta name="theme-color" content="#b0345c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tables">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root {
  --bg: #f6f4ef; --surface: #ffffff; --text: #1d1b18; --muted: #6b665d; --line: #e3ded3;
  --accent: #b0345c; --accent-ink: #ffffff; --accent-soft: #f8e4eb;
  --free: #1b7d44; --free-bg: #e2f3e8; --full: #6f6a63; --full-bg: #ebe8e2;
  --over: #c0262d; --over-bg: #fde6e6; --hl: #fff1b8; --map-bg: #fbfaf7; --map-line: #cfc9bd;
  --radius: 14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131211; --surface: #1d1b19; --text: #f3f0ea; --muted: #a7a197; --line: #34312c;
    --accent: #ff7aa2; --accent-ink: #1a0d12; --accent-soft: #3a1d27;
    --free: #62d494; --free-bg: #173223; --full: #aaa49b; --full-bg: #2a2825;
    --over: #ff7070; --over-bg: #3b1a1a; --hl: #4d4113; --map-bg: #181715; --map-line: #4a463f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131211; --surface: #1d1b19; --text: #f3f0ea; --muted: #a7a197; --line: #34312c;
  --accent: #ff7aa2; --accent-ink: #1a0d12; --accent-soft: #3a1d27;
  --free: #62d494; --free-bg: #173223; --full: #aaa49b; --full-bg: #2a2825;
  --over: #ff7070; --over-bg: #3b1a1a; --hl: #4d4113; --map-bg: #181715; --map-line: #4a463f;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--text);
  font: 17px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "Noto Sans Arabic", "Noto Sans Hebrew", sans-serif;
  display: flex; flex-direction: column; min-height: 100dvh;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

/* ---------- header ---------- */
header {
  position: sticky; top: 0; z-index: 10; background: var(--bg);
  padding: calc(env(safe-area-inset-top) + 10px) 16px 10px;
  border-bottom: 1px solid var(--line);
}
.topbar { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.topbar h1 { font-size: 17px; margin: 0; flex: 1; font-weight: 700; }
.offline { font-size: 12px; color: var(--free); display: none; white-space: nowrap; }
.offline.on { display: inline; }
.langs { display: flex; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 2px; }
.langs button { min-width: 40px; height: 32px; border-radius: 8px; font-size: 14px; font-weight: 600; color: var(--muted); }
.langs button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.search { position: relative; }
.search input {
  width: 100%; height: 56px; border-radius: var(--radius); border: 2px solid var(--line);
  background: var(--surface); color: var(--text); font-size: 20px; padding: 0 52px 0 16px;
  outline: none; -webkit-appearance: none; appearance: none;
}
[dir="rtl"] .search input { padding: 0 16px 0 52px; }
.search input:focus { border-color: var(--accent); }
.search input::-webkit-search-cancel-button { display: none; }
.clear {
  position: absolute; top: 6px; inset-inline-end: 6px; width: 44px; height: 44px; border-radius: 12px;
  font-size: 22px; color: var(--muted); display: none;
}
.clear.on { display: block; }

/* ---------- main ---------- */
main { flex: 1; padding: 12px 16px calc(env(safe-area-inset-bottom) + 84px); max-width: 720px; width: 100%; margin: 0 auto; }
.hint { color: var(--muted); text-align: center; padding: 28px 8px; }
.summary { color: var(--muted); font-size: 14px; margin: 2px 0 10px; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
.toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 15px; color: var(--text); min-height: 40px; }
.toggle input { width: 20px; height: 20px; accent-color: var(--accent); }

.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  margin-bottom: 10px; display: flex; gap: 12px; padding: 12px; width: 100%; text-align: start; align-items: flex-start;
}
button.card:active { transform: scale(0.99); }
.num {
  flex: none; width: 64px; height: 64px; border-radius: 12px; background: var(--accent); color: var(--accent-ink);
  display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1;
}
.num b { font-size: 30px; }
.num small { font-size: 11px; opacity: .85; margin-top: 3px; }
.num.round { border-radius: 50%; }
.card .body { flex: 1; min-width: 0; }
.meta { font-size: 13px; color: var(--muted); margin-bottom: 4px; }
.g { display: flex; justify-content: space-between; gap: 8px; padding: 3px 0; }
.g .nm { font-weight: 600; font-size: 18px; overflow-wrap: anywhere; }
.g .alt { display: block; font-weight: 400; font-size: 14px; color: var(--muted); }
.g .cnt { color: var(--muted); font-size: 15px; white-space: nowrap; }
.g .note { display: block; font-size: 13px; font-weight: 700; color: var(--over); }
.g.off .nm { opacity: .8; }
.num.none { background: var(--over-bg); color: var(--over); }
.chip { display: inline-block; font-size: 13px; font-weight: 700; padding: 3px 9px; border-radius: 999px; }
.chip.free { background: var(--free-bg); color: var(--free); }
.chip.full { background: var(--full-bg); color: var(--full); }
.chip.over { background: var(--over-bg); color: var(--over); }
.chip.none { background: var(--full-bg); color: var(--muted); font-weight: 500; }
.bar { height: 6px; border-radius: 3px; background: var(--full-bg); overflow: hidden; margin: 6px 0 4px; }
.bar i { display: block; height: 100%; background: var(--free); }
.bar i.full { background: var(--full); }
.bar i.over { background: var(--over); }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.row .grow { flex: 1; }

/* ---------- table detail (sheet + inline) ---------- */
.detail-head { display: flex; gap: 14px; align-items: center; margin-bottom: 10px; }
.detail-head .num { width: 84px; height: 84px; }
.detail-head .num b { font-size: 40px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 10px 0 12px; }
.stat { background: var(--bg); border-radius: 10px; padding: 8px; text-align: center; }
.stat b { display: block; font-size: 22px; }
.stat span { font-size: 12px; color: var(--muted); }
.stat.free b { color: var(--free); } .stat.over b { color: var(--over); }
.glist .g { border-bottom: 1px solid var(--line); padding: 9px 4px; }
.glist .g:last-child { border-bottom: 0; }
.glist .g.hl { background: var(--hl); border-radius: 8px; }
.btn {
  height: 50px; border-radius: 12px; padding: 0 18px; font-weight: 700; font-size: 17px;
  background: var(--accent); color: var(--accent-ink); flex: 1;
}
.btn.ghost { background: var(--surface); color: var(--text); border: 1px solid var(--line); flex: none; }
.actions { display: flex; gap: 8px; margin-top: 14px; }

.sheet-wrap { position: fixed; inset: 0; z-index: 30; display: none; }
.sheet-wrap.on { display: block; }
.backdrop { position: absolute; inset: 0; background: rgba(0,0,0,.45); }
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0; max-height: 88dvh; overflow-y: auto;
  background: var(--surface); border-radius: 20px 20px 0 0; max-width: 720px; margin: 0 auto;
  padding: 10px 16px calc(env(safe-area-inset-bottom) + 16px); animation: up .18s ease-out;
  overscroll-behavior: contain; will-change: transform;
}
.sheet .grab { width: 44px; height: 5px; border-radius: 3px; background: var(--muted); opacity: .45; margin: 2px auto 12px; position: relative; }
.sheet .grab::before { content: ""; position: absolute; inset: -16px -80px; }
@keyframes up { from { transform: translateY(30px); opacity: .6; } to { transform: none; opacity: 1; } }

/* ---------- hall ---------- */
.hall-tools { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.hall-tools .grow { flex: 1; font-size: 13px; color: var(--muted); }
.zoom { width: 44px; height: 44px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); font-size: 22px; font-weight: 700; }
.hall-box {
  background: var(--map-bg); border: 1px solid var(--line); border-radius: var(--radius);
  overflow: auto; -webkit-overflow-scrolling: touch; max-height: calc(100dvh - 250px); direction: ltr;
}
.hall-box svg { display: block; width: 100%; height: auto; direction: ltr; }
svg .deco { fill: none; stroke: var(--map-line); stroke-width: 2; }
svg .deco-fill { fill: var(--surface); stroke: var(--map-line); stroke-width: 2; }
svg .deco-text { fill: var(--muted); font-size: 22px; font-weight: 700; text-anchor: middle; }
svg .ghost { fill: none; stroke: var(--map-line); stroke-dasharray: 4 4; stroke-width: 2; }
svg .t { cursor: pointer; }
svg .t .shape { stroke-width: 2.5; }
svg .t.free .shape { fill: var(--free-bg); stroke: var(--free); }
svg .t.full .shape { fill: var(--full-bg); stroke: var(--full); }
svg .t.over .shape { fill: var(--over-bg); stroke: var(--over); }
svg .t.none .shape { fill: var(--surface); stroke: var(--map-line); stroke-dasharray: 5 4; }
svg .t text { text-anchor: middle; fill: var(--text); pointer-events: none; }
svg .t .n { font-size: 20px; font-weight: 800; }
svg .t .f { font-size: 12px; font-weight: 700; }
svg .t.free .f { fill: var(--free); } svg .t.over .f { fill: var(--over); } svg .t.full .f, svg .t.none .f { fill: var(--muted); }
svg .t.sel .shape { stroke: var(--accent); stroke-width: 5; animation: pulse 1.1s ease-in-out infinite; }
svg .t.dim { opacity: .35; }
@keyframes pulse { 50% { stroke-width: 9; } }
.legend { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 13px; color: var(--muted); margin-top: 8px; }
.legend span::before { content: ""; display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-inline-end: 5px; vertical-align: -1px; border: 2px solid; }
.legend .l-free::before { background: var(--free-bg); border-color: var(--free); }
.legend .l-full::before { background: var(--full-bg); border-color: var(--full); }
.legend .l-over::before { background: var(--over-bg); border-color: var(--over); }
.legend .l-none::before { border-style: dashed; border-color: var(--map-line); }

/* ---------- bottom nav ---------- */
nav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 20; background: var(--surface);
  border-top: 1px solid var(--line); display: flex; padding: 6px 12px calc(env(safe-area-inset-bottom) + 6px);
}
nav button { flex: 1; height: 56px; border-radius: 12px; font-weight: 700; font-size: 16px; color: var(--muted); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
nav button svg { width: 24px; height: 24px; }
nav button[aria-current="true"] { color: var(--accent); background: var(--accent-soft); }
</style>
</head>
<body>
<header>
  <div class="topbar">
    <h1 id="title">Table Finder</h1>
    <span class="offline" id="offline"></span>
    <div class="langs" role="group" aria-label="Language">
      <button data-lang="he">עב</button>
      <button data-lang="ar">عر</button>
      <button data-lang="en">EN</button>
    </div>
  </div>
  <div class="search">
    <input id="q" type="search" dir="auto" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
    <button class="clear" id="clear" aria-label="Clear">✕</button>
  </div>
</header>

<main id="main"></main>

<nav>
  <button data-view="list" id="navList">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
    <span></span>
  </button>
  <button data-view="hall" id="navHall">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="15.5" cy="9" r="2"/><circle cx="15.5" cy="16" r="2"/><path d="M7 7v10"/></svg>
    <span></span>
  </button>
</nav>

<div class="sheet-wrap" id="sheetWrap">
  <div class="backdrop" id="backdrop"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
</div>

<script src="data.js"></script>
<script src="search.js"></script>
<script src="hall.js"></script>
<script src="app.js"></script>
</body>
</html>
